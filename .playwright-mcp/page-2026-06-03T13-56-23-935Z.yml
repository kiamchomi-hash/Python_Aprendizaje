          - paragraph [ref=e167]:
            - text: You can also put arithmetic operations inside a
            - code [ref=e168]: print
            - text: command. Running it will then print out the result of the operation. For example, the following program
          - code [ref=e171]: print(2 + 5) print(3 * 3) print(2 + 2 * 10)
          - paragraph [ref=e172]: "prints out these lines:"
          - generic [ref=e173]:
            - generic [ref=e174]: Sample output
            - paragraph [ref=e176]: 7 9 22
          - paragraph [ref=e177]:
            - text: Notice the lack of quotation marks around the arithmetic operations above. Quotation marks are used to signify
            - emphasis [ref=e178]: strings
            - text: ". In the context of programming, strings are sequences of characters. They can consist of letters, numbers and any other types of characters, such as punctuation. Strings aren't just words as we commonly understand them, but instead a single string can be as long as multiple complete sentences. Strings are usually printed out exactly as they are written. Thus, the following two commands produce two quite different results:"
          - code [ref=e181]: print(2 + 2 * 10) print("2 + 2 * 10")
          - paragraph [ref=e182]: "This program prints out:"
          - generic [ref=e183]:
            - generic [ref=e184]: Sample output
            - paragraph [ref=e186]: 22 2 + 2 * 10
          - paragraph [ref=e187]: With the second line of code, Python does not calculate the result of the operation, but instead prints out the operation itself, as a string. So, strings are printed out just as they are written, without any reference to their contents.
          - heading "Commenting commenting permalink" [level=2] [ref=e188]:
            - text: Commenting
            - link "commenting permalink" [ref=e189] [cursor=pointer]:
              - /url: "#commenting"
          - paragraph [ref=e190]:
            - text: Any line beginning with the pound sign
            - code [ref=e191]: "#"
            - text: ", also known as a hash or a number sign, is a comment. This means that any text on that line following the"
            - code [ref=e192]: "#"
            - text: symbol will not in any way affect how the program functions. Python will simply ignore it.
          - paragraph [ref=e193]: "Comments are used for explaining how a program works, to both the programmer themselves, and others reading the program code. In this program a comment explains the calculation performed in the code:"
          - code [ref=e196]: "print(\"Hours in a year:\") # there are 365 days in a year and 24 hours in each day print(365*24)"
