          - code [ref=e144]: print(Hi there!)
          - paragraph [ref=e145]: "will not print out the message, but instead causes an error:"
          - generic [ref=e146]:
            - generic [ref=e147]: Sample output
            - generic [ref=e149]: "File \"\", line 1 print(Hi there!) ^ SyntaxError: invalid syntax"
          - paragraph [ref=e150]: In summary, if you want to print text, the text must all be encased in quotation marks or Python will not interpret it correctly.
          - generic [ref=e151]: Loading...
          - heading "A program of multiple commands a program of multiple commands permalink" [level=2] [ref=e152]:
            - text: A program of multiple commands
            - link "a program of multiple commands permalink" [ref=e153] [cursor=pointer]:
