          - paragraph [ref=e127]:
            - text: Computer programs consist of
            - emphasis [ref=e128]: commands
            - text: ", each command instructing the computer to take some action. A computer executes these commands one by one. Among other things, commands can be used to perform calculations, compare things in the computer's memory, cause changes in how the program functions, relay messages or ask for information from the program's user."
          - paragraph [ref=e129]:
            - text: Let's begin programming by getting familiar with the
            - code [ref=e130]: print
            - text: command, which
            - emphasis [ref=e131]: prints
            - text: text. In this context, printing essentially means that the program will show some text on the screen.
          - paragraph [ref=e132]: "The following program will print the line \"Hi there!\":"
